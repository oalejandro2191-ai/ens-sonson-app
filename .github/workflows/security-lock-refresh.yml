name: Refresh Next Security Lockfile

on:
  push:
    branches: [security/next-16.3.3]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-16.3.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update lockfile for patched Next.js
        run: npm install next@16.3.3 --save-exact --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: refresh lockfile for Next.js 16.3.3"
          git push origin HEAD:security/next-16.3.3
