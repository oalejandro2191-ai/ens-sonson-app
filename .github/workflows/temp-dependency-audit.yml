name: Temporary Dependency Audit

on:
  push:
    branches: [security/next-16.3.3]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency chains
        shell: bash
        run: |
          echo "=== ALL CHAINS ==="
          npm ls js-yaml sharp --all || true
          echo "=== PRODUCTION CHAINS ==="
          npm ls js-yaml sharp --omit=dev --all || true
      - name: Safe audit-fix dry run
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --dry-run --json
          echo "dry_run_exit_code=$?"
          exit 0
