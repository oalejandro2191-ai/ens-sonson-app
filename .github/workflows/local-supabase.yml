name: Local Supabase Pilot

on:
  pull_request:
    branches: [staging]
    paths:
      - 'supabase/**'
      - 'tests/local-supabase/**'
      - 'tests/migration-boundary.test.mjs'
      - 'tests/repository-secrets.test.mjs'
      - '.github/workflows/local-supabase.yml'
  push:
    branches: [feature/local-supabase-pilot-harness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Record tool versions
        run: |
          docker --version
          supabase --version
          node --version
          npm --version
          psql --version
      - name: Guard deployable migrations and repository secrets
        run: node --test tests/migration-boundary.test.mjs tests/repository-secrets.test.mjs
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Reset database from deployable migrations and local seed
        run: supabase db reset --local
      - name: Load TEST-ONLY helpers outside deployable migrations
        shell: bash
        run: |
          supabase status -o env > /tmp/ens-supabase.env
          set -a
          source /tmp/ens-supabase.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/local/test_helpers.sql
      - name: SQL guard for valid-review spacing candidate
        shell: bash
        run: |
          set -a
          source /tmp/ens-supabase.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/local-supabase/mastery-spacing.sql
      - name: Run Auth, RLS, RPC and mastery integration suite
        shell: bash
        run: |
          set -a
          source /tmp/ens-supabase.env
          set +a
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node tests/local-supabase/pilot-security-learning.mjs
      - name: Database state summary
        shell: bash
        run: |
          supabase status
          supabase db lint --local
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
