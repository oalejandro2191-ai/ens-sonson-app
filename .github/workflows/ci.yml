name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging, feature/local-studentapp-integration]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap lockfile when absent
        id: lock
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install reproducibly
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Upload generated lockfile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - name: Commit generated lockfile to staging
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && steps.lock.outputs.generated == 'true' && success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock stabilization dependencies"
          git push origin HEAD:staging
